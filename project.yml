name: TVRemote

options:
  bundleIdPrefix: local.eduardo.tvremote
  deploymentTarget:
    macOS: "14.0"

packages:
  AndroidTVRemoteControl:
    path: Vendor/AndroidTVRemoteControl

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CURRENT_PROJECT_VERSION: "30"
    MARKETING_VERSION: "1.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: C66H6X7SJ9

targets:
  TVRemote:
    type: application
    platform: macOS
    sources:
      - path: TVRemote
      - path: TVRemoteWidget/TVCommandIntent.swift
      - path: Shared
        excludes:
          - Resources
      - path: Shared/Resources
        buildPhase: resources
    dependencies:
      - package: AndroidTVRemoteControl
      - target: TVRemoteWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.eduardo.tvremote
        PRODUCT_NAME: TVRemote
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: TVRemote/TVRemote.entitlements
    info:
      path: TVRemote/Info.plist
      properties:
        CFBundleDisplayName: TV Remote
        CFBundleName: TV Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities

  TVRemoteWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: TVRemoteWidget
      - path: Shared
        excludes:
          - Resources
      - path: Shared/Resources
        buildPhase: resources
    dependencies:
      - package: AndroidTVRemoteControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.eduardo.tvremote.widget
        PRODUCT_NAME: TVRemoteWidgetExtension
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: TVRemoteWidget/TVRemoteWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: TVRemoteWidget/Info.plist
      properties:
        CFBundleDisplayName: TV Remote
        CFBundleName: TV Remote Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  TVRemote:
    build:
      targets:
        TVRemote: all
        TVRemoteWidgetExtension: all
    run:
      config: Debug
